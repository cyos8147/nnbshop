<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NNBShop — เสื้อผ้าวินเทจมือสอง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{ font-family:'IBM Plex Sans Thai', sans-serif; }
  .font-display{ font-family:'Prompt', sans-serif; }
</style>
</head>
<body class="bg-stone-50 text-stone-900">

<nav class="sticky top-0 z-30 bg-stone-50/95 backdrop-blur border-b border-stone-200">
  <div class="max-w-6xl mx-auto px-4 lg:px-8 h-16 flex items-center justify-between">
    <span id="shopName" class="text-xl font-extrabold tracking-tight font-display">…</span>
    <div class="flex items-center gap-3 flex-1 justify-end">
      <input id="searchInput" type="text" placeholder="ค้นหาแบรนด์, ชื่อสินค้า..." class="w-full max-w-[220px] text-sm border border-stone-300 rounded-full px-4 py-1.5 focus:outline-none focus:border-orange-600">
    </div>
  </div>
</nav>

<!-- STOREFRONT -->
<div id="storeView">
  <section class="max-w-6xl mx-auto px-4 lg:px-8 pt-10 pb-6">
    <p id="tagline" class="text-xs font-bold text-orange-700 uppercase tracking-widest mb-2 font-display"></p>
    <h1 class="text-3xl lg:text-5xl font-extrabold leading-tight font-display">
      ของหายาก <span class="text-orange-700">มือสอง</span><br class="hidden lg:block"> คัดมาแล้วทุกชิ้น
    </h1>
    <p id="heroSub" class="text-stone-500 mt-3 max-w-md text-sm lg:text-base"></p>
  </section>

  <section class="max-w-6xl mx-auto px-4 lg:px-8 pb-16">
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-lg font-bold font-display">สินค้าทั้งหมด (<span id="countLabel">0</span>)</h2>
      <button id="filterToggle" class="lg:hidden flex items-center gap-1.5 text-sm font-medium border border-stone-300 px-3 py-1.5 rounded-full">ตัวกรอง</button>
    </div>

    <div class="grid lg:grid-cols-[220px_1fr] gap-8">
      <div id="filterOverlay" class="fixed inset-0 z-40 hidden lg:static lg:block lg:z-auto">
        <div class="absolute inset-0 bg-black/40 lg:hidden" onclick="document.getElementById('filterOverlay').classList.add('hidden')"></div>
        <div class="absolute right-0 top-0 h-full w-80 bg-white p-6 overflow-y-auto lg:static lg:w-full lg:h-auto lg:p-0 lg:bg-transparent">
          <div id="filterGroups"></div>
        </div>
      </div>
      <div id="cardGrid" class="grid grid-cols-2 md:grid-cols-3 gap-5"><p class="text-stone-400 col-span-full">กำลังโหลด...</p></div>
    </div>
  </section>

  <footer class="border-t border-stone-200 py-6">
    <div class="max-w-6xl mx-auto px-4 lg:px-8 flex justify-between items-center flex-wrap gap-3">
      <p id="footShopName" class="text-xs text-stone-400"></p>
      <div id="footLinks" class="flex gap-4 text-xs text-stone-400"></div>
    </div>
  </footer>
</div>

<!-- DETAIL VIEW -->
<div id="detailView" class="hidden max-w-6xl mx-auto px-4 lg:px-8 py-6"></div>

<script src="/config.js"></script>
<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CONDITION = {
  9: { label: "9/10 — เกือบใหม่", cls: "bg-emerald-700" },
  7: { label: "7/10 — สภาพดี", cls: "bg-amber-700" },
  5: { label: "5/10 — มีตำหนิเล็กน้อย", cls: "bg-orange-800" },
};

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s).replace(/`/g, '&#96;'); }
function fmt(n){ return Number(n).toLocaleString('th-TH'); }

let items = [];
let cfg = {};
let filters = { brand: 'ทั้งหมด', size: 'ทั้งหมด', score: null, search: '' };

async function load(){
  const { data: c, error: cErr } = await sb.from('config').select('*').eq('id', 1).single();
  const { data: rows, error: iErr } = await sb.from('items').select('*').order('created_at', { ascending: false });
  if (cErr || iErr){
    cardGrid.innerHTML = '<p class="text-red-600 col-span-full">โหลดข้อมูลไม่สำเร็จ ตรวจสอบ config.js และ Supabase</p>';
    console.error(cErr || iErr);
    return;
  }
  cfg = c; items = rows || [];

  shopName.textContent = cfg.shop_name;
  footShopName.textContent = `© 2026 ${cfg.shop_name}`;
  tagline.textContent = cfg.tagline;
  heroSub.textContent = cfg.hero_sub;
  footLinks.innerHTML = cfg.ig_url ? `<a href="${escAttr(cfg.ig_url)}" target="_blank" class="hover:text-stone-700">Instagram</a>` : '';

  renderFilters();
  renderGrid();
}

function renderFilters(){
  const brands = ['ทั้งหมด', ...new Set(items.map(i=>i.brand))];
  const sizes = ['ทั้งหมด','S','M','L','XL'];
  function group(title, options, key){
    return `<div class="mb-6"><p class="text-xs font-bold text-stone-500 uppercase tracking-wider mb-3 font-display">${title}</p><div class="flex flex-wrap gap-2">
      ${options.map(o => `<button data-group="${key}" data-val="${escAttr(o)}" class="chip px-3 py-1.5 rounded-full text-xs font-medium border ${filters[key]===o?'bg-stone-900 text-white border-stone-900':'bg-white text-stone-600 border-stone-300'}">${esc(o)}</button>`).join('')}
    </div></div>`;
  }
  function scoreGroup(){
    return `<div class="mb-6"><p class="text-xs font-bold text-stone-500 uppercase tracking-wider mb-3 font-display">สภาพสินค้า</p><div class="flex flex-wrap gap-2">
      ${[9,7,5].map(s => `<button data-group="score" data-val="${s}" class="chip px-3 py-1.5 rounded-full text-xs font-medium border ${filters.score===s?'bg-stone-900 text-white border-stone-900':'bg-white text-stone-600 border-stone-300'}">${CONDITION[s].label}</button>`).join('')}
    </div></div>`;
  }
  filterGroups.innerHTML = group('แบรนด์', brands, 'brand') + group('ไซส์', sizes, 'size') + scoreGroup();
  filterGroups.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => {
    const g = btn.getAttribute('data-group'); const v = btn.getAttribute('data-val');
    if (g === 'score'){ const n = Number(v); filters.score = filters.score === n ? null : n; }
    else filters[g] = v;
    renderFilters(); renderGrid();
  }));
}

function renderGrid(){
  const q = filters.search.trim().toLowerCase();
  const visible = items.filter(i =>
    (filters.brand==='ทั้งหมด' || i.brand===filters.brand) &&
    (filters.size==='ทั้งหมด' || i.size_label===filters.size) &&
    (!filters.score || i.condition_score===filters.score) &&
    (!q || i.title.toLowerCase().includes(q) || i.brand.toLowerCase().includes(q))
  );
  countLabel.textContent = visible.length;
  cardGrid.innerHTML = visible.length ? visible.map(i => `
    <button data-id="${i.id}" class="card-btn text-left group">
      <div class="relative aspect-[3/4] rounded-lg overflow-hidden bg-stone-200">
        ${i.images && i.images[0] ? `<img src="${escAttr(i.images[0])}" class="w-full h-full object-cover" alt="${escAttr(i.title)}">` : `<div class="w-full h-full flex items-center justify-center text-stone-400 text-xs">ไม่มีรูป</div>`}
        ${i.sold ? `<div class="absolute inset-0 bg-black/50 flex items-center justify-center"><span class="text-white text-sm font-bold font-display">ขายแล้ว</span></div>` : ''}
        ${(!i.sold && i.single_stock) ? `<div class="absolute top-2.5 left-2.5 inline-flex items-center gap-1 bg-red-700 text-white px-2.5 py-1 rounded-full text-[11px] font-bold font-display">เหลือชิ้นเดียว</div>` : ''}
        <div class="absolute bottom-2.5 left-2.5"><span class="${CONDITION[i.condition_score].cls} text-white px-2.5 py-1 text-[11px] rounded-full font-bold font-display">${CONDITION[i.condition_score].label}</span></div>
      </div>
      <div class="mt-3">
        <p class="text-[11px] text-stone-500 uppercase tracking-wider">${esc(i.brand)}</p>
        <h3 class="text-sm font-semibold mt-0.5 leading-snug font-display">${esc(i.title)}</h3>
        <div class="flex items-center gap-2 mt-1.5">
          ${i.old_price ? `<span class="text-xs text-stone-400 line-through">฿${fmt(i.old_price)}</span>` : ''}
          <span class="text-base font-bold">฿${fmt(i.price)}</span>
        </div>
      </div>
    </button>
  `).join('') : '<p class="text-stone-400 col-span-full py-10 text-center">ไม่พบสินค้าตามตัวกรองที่เลือก</p>';

  cardGrid.querySelectorAll('.card-btn').forEach(btn => btn.addEventListener('click', () => showDetail(Number(btn.getAttribute('data-id')))));
}

function showDetail(id){
  const p = items.find(i => i.id === id);
  if (!p) return;
  storeView.classList.add('hidden');
  detailView.classList.remove('hidden');
  window.scrollTo({top:0});

  const gallery = (p.images && p.images.length ? p.images : [null]);
  detailView.innerHTML = `
    <button id="backBtn" class="flex items-center gap-1.5 text-sm text-stone-500 hover:text-stone-900 mb-6">← กลับไปดูสินค้าทั้งหมด</button>
    <div class="grid lg:grid-cols-2 gap-10">
      <div>
        <div class="relative aspect-[3/4] rounded-xl overflow-hidden bg-stone-200">
          ${gallery[0] ? `<img src="${escAttr(gallery[0])}" class="w-full h-full object-cover" alt="${escAttr(p.title)}">` : `<div class="w-full h-full flex items-center justify-center text-stone-400 text-sm">ไม่มีรูป</div>`}
          ${(!p.sold && p.single_stock) ? `<div class="absolute top-4 left-4 inline-flex items-center gap-1 bg-red-700 text-white px-2.5 py-1 rounded-full text-[11px] font-bold font-display">เหลือชิ้นเดียว</div>` : ''}
        </div>
        ${gallery.length > 1 ? `<div class="flex gap-2 mt-3">${gallery.slice(1).map(g => `<img src="${escAttr(g)}" class="w-16 h-16 rounded-lg object-cover flex-shrink-0">`).join('')}</div>` : ''}
        ${p.defects && p.defects.length ? `
          <div class="mt-6 border border-orange-200 bg-orange-50 rounded-xl p-4">
            <p class="text-xs font-bold uppercase tracking-wider text-orange-800 mb-3 font-display">จุดตำหนิที่พบ (${p.defects.length})</p>
            <div class="space-y-2">
              ${p.defects.map(d => `
                <div class="flex items-center gap-3 bg-white rounded-lg p-2 border border-orange-100">
                  ${d.image ? `<img src="${escAttr(d.image)}" class="w-14 h-14 rounded object-cover flex-shrink-0">` : `<div class="w-14 h-14 rounded bg-stone-100 flex-shrink-0"></div>`}
                  <p class="text-sm text-stone-700">${esc(d.note)}</p>
                </div>
              `).join('')}
            </div>
          </div>` : ''}
      </div>
      <div>
        <p class="text-xs text-stone-500 uppercase tracking-wider">${esc(p.brand)} · ${esc(p.category)}</p>
        <h1 class="text-2xl font-bold mt-1 font-display">${esc(p.title)}</h1>
        <div class="mt-4"><span class="${CONDITION[p.condition_score].cls} text-white px-3.5 py-1.5 rounded-full text-sm font-bold font-display">${CONDITION[p.condition_score].label}</span></div>
        <div class="flex items-baseline gap-3 mt-5">
          ${p.old_price ? `<span class="text-lg text-stone-400 line-through">฿${fmt(p.old_price)}</span>` : ''}
          <span class="text-3xl font-bold">฿${fmt(p.price)}</span>
        </div>
        ${p.sold
          ? `<div class="mt-6 w-full bg-stone-200 text-stone-500 py-3.5 rounded-lg font-bold text-center font-display">สินค้านี้ขายแล้ว</div>`
          : cfg.ig_url
            ? `<a href="${escAttr(cfg.ig_url)}" target="_blank" class="mt-6 w-full bg-stone-900 text-white py-3.5 rounded-lg font-bold flex items-center justify-center gap-2 hover:bg-orange-700 transition-colors font-display">สั่งซื้อผ่าน Instagram</a>`
            : `<div class="mt-6 w-full bg-stone-200 text-stone-500 py-3.5 rounded-lg font-bold text-center font-display">ยังไม่เปิดช่องทางสั่งซื้อ</div>`}
        <div class="mt-8">
          <p class="text-sm font-bold mb-3 font-display">ตารางขนาด (วัดจริง)</p>
          <div class="border border-stone-200 rounded-xl overflow-hidden">
            ${Object.entries(p.measurements || {}).map(([k,v], idx) => `
              <div class="flex justify-between px-4 py-2.5 text-sm ${idx%2===0?'bg-stone-50':'bg-white'}"><span class="text-stone-500">${esc(k)}</span><span class="font-medium">${esc(v)}</span></div>
            `).join('') || '<p class="text-sm text-stone-400 p-4">ไม่มีข้อมูลขนาด</p>'}
          </div>
          <p class="text-xs text-stone-400 mt-2">ไซส์ป้ายอาจไม่ตรงตัว แนะนำให้ดูตารางวัดจริงเป็นหลัก</p>
        </div>
      </div>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => {
    detailView.classList.add('hidden');
    storeView.classList.remove('hidden');
    window.scrollTo({top:0});
  });
}

searchInput.addEventListener('input', (e) => { filters.search = e.target.value; renderGrid(); });
filterToggle.addEventListener('click', () => filterOverlay.classList.remove('hidden'));

load();
</script>
</body>
</html>
